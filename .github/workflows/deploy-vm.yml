name: Deploy to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-weather-starter-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_PORT: ${{ secrets.VM_PORT }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      APP_DIR: /opt/weather-starter
      DEPLOY_BRANCH: main

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare SSH client
        run: |
          set -euo pipefail
          : "${VM_HOST:?Missing VM_HOST secret}"
          : "${VM_USER:?Missing VM_USER secret}"
          : "${VM_SSH_PRIVATE_KEY:?Missing VM_SSH_PRIVATE_KEY secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/weather_starter_deploy
          chmod 600 ~/.ssh/weather_starter_deploy

          port="${VM_PORT:-22}"
          ssh-keyscan -H -p "$port" "$VM_HOST" >> ~/.ssh/known_hosts
        shell: bash

      - name: Update repository on VM
        run: |
          set -euo pipefail
          port="${VM_PORT:-22}"
          remote_cmd='set -euo pipefail; cd /opt/weather-starter; git fetch origin main; git reset --hard origin/main; git clean -fd; npm ci; npm run build; sudo systemctl restart weather-starter; sudo systemctl is-active --quiet weather-starter; curl -fsS http://127.0.0.1:3000/health >/dev/null'
          ssh -i ~/.ssh/weather_starter_deploy \
            -p "$port" \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" bash -se -c "$remote_cmd"
        shell: bash

      - name: Build and restart on VM
        run: |
          set -euo pipefail
          port="${VM_PORT:-22}"
          remote_cmd='set -euo pipefail; cd /opt/weather-starter; npm ci; npm run build; sudo systemctl restart weather-starter; sudo systemctl is-active --quiet weather-starter; curl -fsS http://127.0.0.1:3000/health >/dev/null'
          ssh -i ~/.ssh/weather_starter_deploy \
            -p "$port" \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" bash -se -c "$remote_cmd"
        shell: bash