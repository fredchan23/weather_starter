[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 is the newest runtime supported by Netlify Functions (Lambda). The app
  # no longer uses node:sqlite, so it no longer needs Node 24.
  NODE_VERSION = "22"
  # NODE_ENV=production (set for the function runtime) would otherwise make npm
  # skip devDependencies, but the build needs them (typescript, vite, etc.).
  NPM_FLAGS = "--include=dev"
  # NODE_ENV's value ("production") legitimately appears throughout the frontend
  # build, so exclude just that key from secret scanning (real secrets like
  # TURSO_AUTH_TOKEN are still scanned).
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"

[functions]
  node_bundler = "esbuild"
  # Keep runtime dependencies OUT of the bundle. The function is ESM ("type":
  # "module"), and inlining CommonJS deps (express, serverless-http, …) into ESM
  # makes esbuild emit a require() shim that throws "Dynamic require of 'http' is
  # not supported" at load. Left external, Node loads them normally. This also
  # covers the native @libsql/client/libsql and the dev-only vite import.
  external_node_modules = [
    "@libsql/client",
    "libsql",
    "drizzle-orm",
    "express",
    "serverless-http",
    "helmet",
    "cors",
    "express-rate-limit",
    "pino",
    "pino-http",
    "dotenv",
    "vite",
  ]

# API and health checks are handled by the Express app running as a function.
# Netlify preserves the original request path in the function event, so Express
# still matches its /api/* and /health routes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback — every other path serves the built React app. Must be last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
